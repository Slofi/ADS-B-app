<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADS-B</title>
<link rel="stylesheet" href="/static/lib/leaflet.css" onerror="this.onerror=null;this.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<!-- Header -->
<header id="header">
  <div class="header-left">
    <span class="app-title">✈ ADS-B</span>
    <span class="status-dot" id="d1090-dot" title="dump1090"></span>
    <span class="header-stat" id="stat-count">0 aircraft</span>
    <span class="header-sep">·</span>
    <span class="header-stat" id="stat-farthest"></span>
  </div>
  <div class="header-right">
    <button class="hdr-btn" id="d1090-start-btn" onclick="d1090Action('start')">Start</button>
    <button class="hdr-btn" onclick="d1090Action('restart')">Restart</button>
    <button class="hdr-btn hdr-btn-danger" onclick="d1090Action('stop')">Stop</button>
    <button class="hdr-btn" id="rings-btn" onclick="toggleRings()" title="Range rings">⊙</button>
    <button class="hdr-btn" id="gear-btn" onclick="toggleSettings()" title="Settings">⚙</button>
  </div>
</header>

<!-- Main layout -->
<div id="main">
  <div id="map"></div>

  <!-- Right panel -->
  <div id="panel">
    <div class="panel-tabs">
      <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">Active <span id="badge-active" class="tab-badge">0</span></button>
      <button class="tab-btn" id="tab-history" onclick="switchTab('history')">History <span id="badge-history" class="tab-badge">0</span></button>
    </div>
    <div id="ac-list"></div>
  </div>
</div>


<!-- Settings panel -->
<div id="settings" class="settings hidden">
  <div class="settings-header">
    <span class="settings-title-text">Settings</span>
  </div>

  <div class="set-section">Aircraft DB</div>
  <div class="set-row">
    <span id="db-version-label">Loading…</span>
    <button class="set-btn" onclick="updateDb()" id="db-update-btn">Update</button>
  </div>
  <div id="db-status-msg" style="font-size:11px;color:var(--muted);padding:0 0 6px 0 14px"></div>

  <div class="set-section">Map Layer</div>
  <div id="layer-picker"></div>

  <div class="set-section">Display</div>
  <div class="set-row">
    <span>Range rings</span>
    <label class="toggle"><input type="checkbox" id="rings-toggle" onchange="toggleRings()" checked><span class="slider"></span></label>
  </div>
  <div id="rings-opts" class="rings-opts"></div>
  <div class="set-row">
    <span>Trails</span>
    <label class="toggle"><input type="checkbox" id="trails-toggle" onchange="toggleTrails()" checked><span class="slider"></span></label>
  </div>
  <div class="set-row">
    <span>Accent color</span>
    <input type="color" id="accent-input" value="#e8b04f" onchange="setAccent(this.value)" style="cursor:pointer;border:none;background:none;width:36px;height:28px">
  </div>

  <div class="set-section">App</div>
  <div class="set-row" style="padding-bottom:2px">
    <span id="app-version" style="font-size:11px;color:var(--muted)">…</span>
  </div>
  <div class="set-row" style="gap:6px">
    <button class="set-btn" onclick="checkUpdate()" id="check-update-btn">Check</button>
    <button class="set-btn" onclick="updateApp()">Pull &amp; restart</button>
  </div>
  <div id="update-msg" style="font-size:11px;padding:2px 14px 6px"></div>
  <div class="set-row" style="gap:6px">
    <button class="set-btn" onclick="appRestart()">Restart app</button>
    <button class="set-btn danger" onclick="appShutdown()">Shutdown</button>
  </div>
</div>

<script src="/static/lib/leaflet.js" onerror="(function(){var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';document.head.appendChild(s)})()"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
